name: Build Snap

on:
  workflow_dispatch:
  # push:
  #   branches: [ default ]

jobs:
  sources:
    uses: ./.github/workflows/prep_sources.yml
    secrets: inherit

  build:
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:

    - name: Download source artifact
      uses: actions/download-artifact@v7
      with:
        name: source_package

    - name: untar files
      run: tar -xvf sources.tar

    - name: Invoke snapcraft build
      uses: snapcore/action-build@v1
      id: snapcraft
      with:
        path: beremiz_public_dist

    - name: Move Snap package to build directory
      env:
        SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
      run: |
        mkdir -p beremiz_public_dist/build
        mv "$SNAP_FILE" beremiz_public_dist/build/

    - name: Upload built artifact
      uses: actions/upload-artifact@v6
      with:
        name: snap-${{ matrix.arch }}
        path: beremiz_public_dist/build/*.snap


