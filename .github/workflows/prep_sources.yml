name: Prepare sources

on:
  workflow_call:


jobs:
  get_sources:
    runs-on: ubuntu-latest

    env:
        # Versiones anteriores de Beremiz oficial
        # beremiz_revisionid: 7e99f6ee1d2abc7d936c1222758e928afdc817ea
        # matiec_revisionid: 79410c7660cf337ec7991a167e53ef141a26caf9
        # canfestival_revisionid: c41b9cc7224398cc8f5a3b853f3743b395d02222
        # Modbus_revisionid: 74a5f6a2c3f9b61308a62fc58bbe10572d79a003
        # open62541_revisionid: b8ac9e77f703e6ba5c012b886a8821037503daa6

        # Mis versiones publicadas
        beremiz_revisionid: 96c1189fe88020ef44b8433437671886d5b21a26
        matiec_revisionid: 3a41303bcb4e50403417bc39c63f88981d7d961e
        canfestival_revisionid: c41b9cc7224398cc8f5a3b853f3743b395d02222
        Modbus_revisionid: 74a5f6a2c3f9b61308a62fc58bbe10572d79a003
        open62541_revisionid: fb3e17c448ca1a8dbed83ca776401b059b92da7d
        BACnet_revisionid: 7c87c95f6270492a369631f5b58d6e1ac20ea6d3
        paho_mqtt_c_revisionid: 4a939ddb01eea581a32fd6f0adcfee51b91d2601
        frozen_revisionid: cfff12e9d3f20e9ea670ced1beb27be141fa3254
        ethercat_revisionid: f4cbbea0ecfc4fb2d356e7911acad3914d4ac621


    steps:
    - uses: actions/checkout@v5
      with:
          path: beremiz_public_dist

    # repositories are directly checked out where Makefile expects them to be
    - uses: actions/checkout@v5
      with:
#          repository: beremiz/beremiz
          repository: Netzahualcoyotl/beremiz
          ref: ${{ env.beremiz_revisionid }}
          path: build/sources/beremiz

    - uses: actions/checkout@v5
      with:
#          repository: beremiz/matiec
          repository: Netzahualcoyotl/matiec
          ref: ${{ env.matiec_revisionid }}
          path: build/sources/matiec

    - uses: actions/checkout@v5
      with:
#          repository: beremiz/canfestival
          repository: Netzahualcoyotl/canfestival
          ref: ${{ env.canfestival_revisionid }}
          path: build/sources/canfestival

    - uses: actions/checkout@v5
      with:
#          repository: beremiz/Modbus
          repository: Netzahualcoyotl/Modbus
          ref: ${{ env.Modbus_revisionid }}
          path: build/sources/Modbus

    - uses: actions/checkout@v5
      with:
          # Version anterior: repositorio oficial
          # repository: open62541/open62541

          # Repositorio personal, version 1.5.9
          repository: Netzahualcoyotl/open62541
          ref: ${{ env.open62541_revisionid }}
          path: build/sources/open62541

    - uses: actions/checkout@v5
      with:
          repository: Netzahualcoyotl/BACnet
          ref: ${{ env.BACnet_revisionid }}
          path: build/sources/BACnet

    - uses: actions/checkout@v5
      with:
          repository: Netzahualcoyotl/paho-mqtt-c
          ref: ${{ env.paho_mqtt_c_revisionid }}
          path: build/sources/paho.mqtt.c

    - uses: actions/checkout@v5
      with:
          repository: Netzahualcoyotl/frozen
          ref: ${{ env.frozen_revisionid }}
          path: build/sources/frozen

    - uses: actions/checkout@v5
      with:
          repository: Netzahualcoyotl/ethercat
          ref: ${{ env.ethercat_revisionid }}
          path: build/sources/ethercat

    - name: Keep Makefile satisfied and generate revisions.txt
      run: |
        touch build/sources/beremiz_stamp
        touch build/sources/matiec_stamp
        touch build/sources/canfestival_stamp
        touch build/sources/Modbus_stamp
        touch build/sources/open62541_stamp
        touch build/sources/BACnet_stamp
        touch build/sources/paho.mqtt.c_stamp
        touch build/sources/frozen_stamp
        touch build/sources/beremiz_src
        touch build/sources/matiec_src
        touch build/sources/canfestival_src
        touch build/sources/Modbus_src
        touch build/sources/open62541_src
        touch build/sources/BACnet_src
        touch build/sources/paho.mqtt.c_src
        touch build/sources/frozen_src
        touch build/own_sources
        cat >> build/revisions.txt <<EOF
        beremiz_public_dist ${{ github.sha }}
        beremiz ${{ env.beremiz_revisionid }}
        matiec ${{ env.matiec_revisionid }}
        canfestival ${{ env.canfestival_revisionid }}
        Modbus ${{ env.Modbus_revisionid }}
        open62541 ${{ env.open62541_revisionid }}
        BACnet ${{ env.BACnet_revisionid }}
        paho.mqtt.c ${{ env.paho_mqtt_c_revisionid }}
        frozen ${{ env.frozen_revisionid }}
        EOF

    - name: Tar files
      run: tar -cvf sources.tar .

    - name: Upload source artifact
      uses: actions/upload-artifact@v6
      with:
        name: source_package
        path: sources.tar
